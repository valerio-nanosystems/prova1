<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineManiaci - Catalogo Locale</title>
</head>
<body style="font-family: sans-serif; max-width: 900px; margin: 30px auto; padding: 20px; line-height: 1.5;">

    <h1>🎬 CineManiaci - Cerca Film</h1>
    <p>Cerca i titoli archiviati all'interno del database locale della piattaforma.</p>
    
    <div style="margin-bottom: 30px; background: #f1f5f9; padding: 15px; border-radius: 6px;">
        <input type="text" id="campoCerca" placeholder="Scrivi una parte del titolo (es. Matrix)..." style="padding: 8px; width: 300px; font-size: 14px;">
        <button onclick="avviaRicerca()" style="padding: 8px 15px; font-size: 14px; cursor: pointer;">Cerca</button>
    </div>

    <h2>Risultati della Ricerca</h2>
    <div id="risultati" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px;">
        </div>

    <hr>

    <div id="schedaFilm" style="display: none; background: #f0fdf4; border: 1px solid #bbf7d0; padding: 25px; border-radius: 8px;">
        <h2 id="schedaTitolo" style="color: #16a34a; margin-top: 0;"></h2>
        <p><b>Anno di Uscita:</b> <span id="schedaAnno"></span></p>
        <p><b>Trama del Film:</b></p>
        <p id="schedaTrama" style="font-style: italic; color: #374151;"></p>
    </div>


    <script>
        const API_URL = "https://scaling-space-rotary-phone-7v99jx6r5442r5qj-8000.app.github.dev";

        // ESERCITAZIONE 3: Funzione per cercare i film e stampare le Card grafiche
        async function avviaRicerca() {
            let testoFiltro = document.getElementById("campoCerca").value;
            let contenitore = document.getElementById("risultati");
            
            // Chiamata asincrona passandogli il parametro Query
            let risposta = await fetch(API_URL + "/film/cerca?keyword=" + testoFiltro);
            let filmTrovati = await risposta.json();

            contenitore.innerHTML = ""; // Puliamo i vecchi risultati

            if (filmTrovati.length === 0) {
                contenitore.innerHTML = "<p style='color:red; grid-column: 1/-1;'>Nessun film trovato con questa parola chiave.</p>";
                return;
            }

            // Cicliamo l'array dei film arrivati dal Back-end
            filmTrovati.forEach(f => {
                let card = document.createElement("div");
                card.style = "border: 1px solid #e2e8f0; padding: 15px; border-radius: 6px; text-align: center; background: #fff;";
                
                // Costruiamo la card iniettando i dati della riga
                card.innerHTML = 
                    '<img src="' + f.url_locandina +'" style="width: 100%; height: 200px; object-fit: contain; margin-bottom: 10px;">' +
                    '<h4 style="margin: 5px 0 15px 0; min-height: 40px;">' + f.titolo + ' (' + f.anno + ')</h4>' +
                    '<button onclick="apriScheda(' + f.id + ')" style="padding: 5px 10px; cursor:pointer;">Vedi Scheda</button>'
                ;
                contenitore.appendChild(card);
            });
        }

        // ESERCITAZIONE 4: Funzione per caricare i dettagli estesi del singolo film
        async function apriScheda(idFilm) {
            // Interroghiamo la rotta basata sul Path Parameter del Back-end
            let risposta = await fetch(API_URL + '/film/' + idFilm);
            let film = await risposta.json();

            if (risposta.ok) {
                // Catturiamo gli elementi del div di dettaglio e li popoliamo
                document.getElementById("schedaTitolo").textContent = film.titolo;
                document.getElementById("schedaAnno").textContent = film.anno;
                document.getElementById("schedaTrama").textContent = film.trama;
                
                // Rendiamo visibile il blocco modificando la proprietà CSS 'display'
                document.getElementById("schedaFilm").style.display = "block";
                
                // Autoscroll fluido verso la scheda tecnica in fondo alla pagina
                document.getElementById("schedaFilm").scrollIntoView({ behavior: 'smooth' });
            } else {
                alert("Errore nel recupero della scheda: " + film.detail);
            }
        }
    </script>
</body>
</html>
